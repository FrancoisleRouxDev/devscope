# =============================================================================
# dashboard/electron-builder.yml — packaging config for Windows, macOS, Linux
# =============================================================================
# `npm run dist` produces installers in ./release for the CURRENT OS.
# Build each OS's installer ON that OS (or in a CI matrix): the Python sidecar
# and the Rust extension are native code and cannot be cross-compiled here.
#
# Prerequisite: the frozen Python sidecar must exist in
#   resources/sidecar/<os>/        (os = mac | win | linux)
# — produced by `python scripts/build_sidecar.py` (see that file).
# =============================================================================

appId: dev.devscope.app
productName: devscope
copyright: Copyright © 2026 Francois le Roux

directories:
  output: release
  buildResources: resources      # icons live here (see resources/README.md)

# What goes inside app.asar: the built renderer + Electron main/preload.
files:
  - dist/**
  - electron/**
  - package.json

# Shipped NEXT TO app.asar (not inside it) — executables can't run from an
# asar archive. At runtime: path.join(process.resourcesPath, 'sidecar').
extraResources:
  - from: resources/sidecar/${os}
    to: sidecar
    filter: ["**/*"]

asar: true

mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]             # zip is required for auto-update on macOS
  hardenedRuntime: true          # required for notarization
  # notarize: true               # enable once Apple credentials are set in CI env
  icon: icon.icns

win:
  target: [nsis]
  icon: icon.ico
  # Code signing: configure via CSC_LINK / CSC_KEY_PASSWORD env vars in CI,
  # or Azure Trusted Signing. Unsigned builds trigger SmartScreen warnings.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target: [AppImage, deb]
  category: Development
  icon: icon.png
