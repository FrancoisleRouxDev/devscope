[package]
name = "devscope_scanner"
version = "0.1.0"
edition = "2021"
description = "Fast recursive file and line counter for devscope"

[lib]
# cdylib is the Python extension module (PyO3); rlib allows Rust-only tests.
name = "devscope_scanner"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.22"   # Python bindings
ignore = "0.4"  # gitignore-aware directory walking
rayon = "1"     # parallel line counting
walkdir = "2"   # size/mtime walk inside discovered projects
