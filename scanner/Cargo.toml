[package]
name = "devscope_scanner"
version = "0.1.0"
edition = "2021"
description = "Fast recursive file and line counter for devscope"

[lib]
# cdylib is the Python extension module (PyO3); rlib allows Rust-only tests.
name = "devscope_scanner"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Planned (pin versions when logic is written):
# pyo3   - Python bindings
# ignore - gitignore-aware parallel directory walking
# rayon  - parallel line counting
# memchr - fast newline counting
